name: Build & Release Onyx

on:
  push:
    branches: [main, master, 'claude/**']
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: onyx-release
  cancel-in-progress: false

env:
  TAG: v1.0.${{ github.run_number }}
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}

jobs:
  # Les fichiers sont envoyés directement dans une Release (brouillon),
  # publiée à la fin quand tout est prêt.
  prepare:
    name: Préparation de la version
    runs-on: ubuntu-latest
    steps:
      - name: Création du brouillon de Release
        run: |
          gh release create "$TAG" --draft --target "${{ github.sha }}" --title "Onyx ${TAG#v}" --notes "**Onyx ${TAG#v}**

          | Fichier | Pour |
          |---|---|
          | \`onyx-tv.apk\` | La TV (Android TV / Google TV) |
          | \`onyx-remote.apk\` | Le téléphone Android (seul ou comme télécommande de la TV) |
          | \`Onyx-Setup.exe\` | Windows (installation, mises à jour auto) |
          | \`Onyx-Portable.exe\` | Windows (sans installation) |"

  android:
    name: APK Android (TV + téléphone)
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Clé de signature (secrets GitHub)
        env:
          KEYSTORE_B64: ${{ secrets.ONYX_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/onyx.jks"
            echo "ONYX_KEYSTORE_FILE=$RUNNER_TEMP/onyx.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Secret ONYX_KEYSTORE_BASE64 absent : APK signés avec une clé temporaire (les mises à jour automatiques ne pourront pas s'installer par-dessus)."
          fi
      - name: Compilation
        working-directory: android
        env:
          ONYX_KEYSTORE_PASSWORD: ${{ secrets.ONYX_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PonyxVersionCode=${{ github.run_number }} --no-daemon --stacktrace
      - name: Envoi dans la Release
        run: |
          mkdir -p out
          cp android/tv/build/outputs/apk/release/tv-release.apk out/onyx-tv.apk
          cp android/remote/build/outputs/apk/release/remote-release.apk out/onyx-remote.apk
          for i in 1 2 3 4 5; do gh release upload "$TAG" out/onyx-tv.apk out/onyx-remote.apk --clobber && exit 0; echo "nouvel essai dans $((i*15)) s"; sleep $((i*15)); done; exit 1

  windows:
    name: Version Windows
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Dépendances
        working-directory: desktop
        run: npm ci
      - name: Version
        working-directory: desktop
        run: npm version 1.0.${{ github.run_number }} --no-git-tag-version --allow-same-version
      - name: Empaquetage
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist
      - name: Envoi dans la Release
        shell: bash
        run: |
          for i in 1 2 3 4 5; do gh release upload "$TAG" desktop/dist/Onyx-Setup.exe desktop/dist/Onyx-Setup.exe.blockmap desktop/dist/Onyx-Portable.exe desktop/dist/latest.yml --clobber && exit 0; echo "nouvel essai dans $((i*15)) s"; sleep $((i*15)); done; exit 1

  publish:
    name: Publication (mises à jour automatiques)
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - run: |
          for i in 1 2 3; do gh release edit "$TAG" --draft=false --latest && exit 0; sleep 10; done; exit 1

  cleanup:
    name: Nettoyage en cas d'échec
    needs: [android, windows]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - run: gh release delete "$TAG" --yes --cleanup-tag || true
