name: Build & Release Onyx

on:
  push:
    branches: [main, master, 'claude/**']
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: onyx-release
  cancel-in-progress: false

jobs:
  android:
    name: APK Android (TV + téléphone)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Clé de signature (secrets GitHub)
        env:
          KEYSTORE_B64: ${{ secrets.ONYX_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/onyx.jks"
            echo "ONYX_KEYSTORE_FILE=$RUNNER_TEMP/onyx.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Secret ONYX_KEYSTORE_BASE64 absent : APK signés avec une clé temporaire (les mises à jour automatiques ne pourront pas s'installer par-dessus)."
          fi
      - name: Compilation
        working-directory: android
        env:
          ONYX_KEYSTORE_PASSWORD: ${{ secrets.ONYX_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PonyxVersionCode=${{ github.run_number }} --no-daemon --stacktrace
      - name: Renommage
        run: |
          mkdir -p out
          cp android/tv/build/outputs/apk/release/tv-release.apk out/onyx-tv.apk
          cp android/remote/build/outputs/apk/release/remote-release.apk out/onyx-remote.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/

  windows:
    name: Version Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Dépendances
        working-directory: desktop
        run: npm ci
      - name: Version
        working-directory: desktop
        run: npm version 1.0.${{ github.run_number }} --no-git-tag-version --allow-same-version
      - name: Empaquetage
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            desktop/dist/Onyx-Setup.exe
            desktop/dist/Onyx-Setup.exe.blockmap
            desktop/dist/Onyx-Portable.exe
            desktop/dist/latest.yml

  release:
    name: Publication (mises à jour automatiques)
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Onyx 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: 'true'
          body: |
            **Onyx 1.0.${{ github.run_number }}**

            | Fichier | Pour |
            |---|---|
            | `onyx-tv.apk` | La TV (Android TV / Google TV) |
            | `onyx-remote.apk` | Ton téléphone Android (télécommande) |
            | `Onyx-Setup.exe` | Windows (installation, mises à jour auto) |
            | `Onyx-Portable.exe` | Windows (sans installation) |
          files: dist/*
